<!-- ==========================================================================
     PRODUCTION ON-PAGE SEO HEAD BOILERPLATE
     Drop this into the <head> of every page.
     ========================================================================== -->

<!-- Document Encoding & Responsive Viewport -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<!-- Primary SEO Meta Tags -->
<!-- Rule: Primary Keyword - Secondary Keyword / Geo | Brand Name (< 60 chars) -->
<title>Commercial Roofing Contractors in Brooklyn NY | Apex Roofing</title>
<!-- Rule: Action-oriented hook with value prop, phone/CTA (< 155 chars) -->
<meta name="description" content="Looking for trusted commercial roofers in Brooklyn? Apex Roofing delivers 24/7 leak repairs, flat roofing, and certified replacements. Call (718) 555-0144 for free quotes.">
<link rel="canonical" href="https://www.example.com/commercial-roofing-brooklyn/">

<!-- Search Engine Robots Directive -->
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<meta name="googlebot" content="index, follow">

<!-- Open Graph / Facebook / LinkedIn Meta Tags -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Apex Roofing & Remodeling">
<meta property="og:title" content="Commercial Roofing Contractors in Brooklyn NY | Apex Roofing">
<meta property="og:description" content="Certified commercial roofing solutions across Brooklyn. Flat roofs, EPDM membranes, and 24/7 leak mitigation. Get a free inspection.">
<meta property="og:url" content="https://www.example.com/commercial-roofing-brooklyn/">
<meta property="og:image" content="https://www.example.com/assets/images/commercial-roofing-og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Commercial flat roof installation in Brooklyn by Apex Roofing crew">
<meta property="og:locale" content="en_US">

<!-- Twitter Card Meta Tags -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Commercial Roofing Contractors in Brooklyn NY | Apex Roofing">
<meta name="twitter:description" content="Certified commercial roofing solutions across Brooklyn. Flat roofs, EPDM membranes, and 24/7 leak mitigation.">
<meta name="twitter:image" content="https://www.example.com/assets/images/commercial-roofing-og.jpg">

<!-- Geo Location Tags for Local SEO Relevance -->
<meta name="geo.region" content="US-NY">
<meta name="geo.placename" content="Brooklyn">
<meta name="geo.position" content="40.6698;-73.9875">
<meta name="ICBM" content="40.6698, -73.9875">

<!-- Performance Pre-Connects & Font Optimization -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="/assets/images/hero-banner.webp" fetchpriority="high">

<!-- Favicon & Web App Manifest -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0284c7">
